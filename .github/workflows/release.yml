name: Windows release
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'installer/**', 'scripts/**', '.github/workflows/release.yml', 'global.json', 'Directory.Build.props']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish and test
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler is missing from the runner.' }
          [xml]$project = Get-Content src/Still.App/Still.App.csproj
          ./scripts/build-installer.ps1 -Compiler $compiler -Version ([string]$project.Project.PropertyGroup.Version)
      - name: Write release checksums
        shell: pwsh
        run: |
          Get-FileHash artifacts/Still-Setup-win-x64.exe,artifacts/Still-win-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Still-Windows
          path: |
            artifacts/Still-Setup-win-x64.exe
            artifacts/Still-win-x64.zip
            artifacts/SHA256SUMS.txt
      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content src/Still.App/Still.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Bump the app version before publishing." }
          gh release create $tag artifacts/Still-Setup-win-x64.exe artifacts/Still-win-x64.zip artifacts/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Still $version" --notes-file docs/RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
